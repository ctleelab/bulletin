name: ctleelab research
description:  Research brought to you by the ctleelab at the University of California San Diego
url: https://ctleelab.ucsd.edu
baseurl: 

markdown: kramdown
permalink: /:categories/:title/
future: true
sass:
  sass_dir: css
  # Silence Sass deprecation warnings from vendored Bootstrap 5.3.x and
  # from our own @import-based entry point. Bootstrap 5.3 was finalized
  # before Dart Sass turned these categories on by default (Aug 2024) and
  # the @use migration is held for Bootstrap 6. Revisit when BS6 is adopted.
  quiet_deps: true
  silence_deprecations:
    - import
    - if-function
    - global-builtin
    - color-functions


plugins:
  - jekyll-gzip
  - jekyll-twitter-plugin

gzip:
  replace_files: true

exclude:
  - "*.cpp"
  - "*.csv"
  - "*.gz"
  - "*.h"
  - "*.ipynb"
  - "*.log"
  - "*.py"
  - "*.R"
  - "*.rb"
  - "*.tiff"
  - "*.txt"
  - "*.zip"
  - "Gemfile"
  - "Gemfile.lock"
  - "README.md"
  - "guide/**"
  - "calendar/**"
  - "rakefile"
  - ".pixi"


projects:
  - 
    repo: ctlee/casc
    branch: main
  - 
    repo: ctlee/gamer
    branch: main
  - 
    repo: ctlee/membrane-spectral-analysis
    branch: main
  - 
    repo: RangamaniLabUCSD/Mem3DG
    branch: main
  - 
    repo: RangamaniLabUCSD/ActuAtorForceEstimation
    branch: main
  - 
    repo: RangamaniLabUCSD/smart
    branch: development
  -
    repo: ctleelab/MemDMA
    branch: master
  
